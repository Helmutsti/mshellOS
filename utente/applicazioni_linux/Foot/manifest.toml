# Il manifesto di Foot, il terminale Wayland di Alpine (la guida voce per voce:
# manifest-guida.toml; le regole: APPLICAZIONI.md).
#
# E' un'APP LINUX: un programma di altri, preso dai pacchetti di Alpine 3.24 con le sue
# librerie (strumenti/compilazione/app_linux.sh, i pacchetti in alpine.txt). Nel pacchetto,
# invece di "code", c'e' la cartella linux/, un piccolo albero tipo Alpine: il caricatore di
# musl (linux/lib/ld-musl-<processore>.so.1), le librerie, il programma e i suoi dati.
# Il launcher non lancia il programma da solo: lancia il caricatore del pacchetto, che carica
# il programma con le librerie del pacchetto (linux = true).

id = "foot"
nome = "Foot"
versione = "1.27.0"
autore = "Daniel Eklöf (pacchetto Alpine 3.24)"
descrizione = "Il terminale Wayland foot, con le sue librerie."

# "@PROCESSORE@" lo sostituisce build.sh con il processore per cui compila (x86_64 o arm64).
processore = "@PROCESSORE@"
sistema_minimo = 1

linux = true
programma = "linux/usr/bin/foot"

nella_barra = false

permessi = []
deviazioni = []
funzioni = []

# PROVVISORIE: le icone del Terminale, copiate tali e quali, finche' Foot non ha le sue.
[icone.chiaro]
svg = "resources/icona-chiara.svg"
png = { 18 = "resources/icona-chiara-18.png", 32 = "resources/icona-chiara-32.png", 48 = "resources/icona-chiara-48.png" }

[icone.scuro]
svg = "resources/icona-scura.svg"
png = { 18 = "resources/icona-scura-18.png", 32 = "resources/icona-scura-32.png", 48 = "resources/icona-scura-48.png" }
