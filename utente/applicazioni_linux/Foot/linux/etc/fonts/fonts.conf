<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  La configurazione di fontconfig per Foot: dentro il pacchetto, in linux/etc/fonts/fonts.conf,
  al posto di quella di Alpine (/etc/fonts/fonts.conf, che cerca i caratteri nelle cartelle del
  sistema e legge decine di file in conf.d). Il launcher la indica a fontconfig con
  FONTCONFIG_FILE.

  Deve funzionare dovunque sia installato il pacchetto (/system/apps/foot, /data/apps/foot...):
  per questo la cartella dei caratteri e' RELATIVA a questo file (prefix="relative"): da
  linux/etc/fonts si sale a linux/ e si scende in usr/share/fonts.

  La cache dei caratteri va nella cartella di cache della persona (prefix="xdg":
  $XDG_CACHE_HOME/fontconfig, che il launcher imposta): mai nel pacchetto, che non si scrive.

  "monospace" (il carattere che foot chiede se la persona non ne sceglie uno) e' DejaVu Sans
  Mono. Oggi e' l'unico carattere nel pacchetto e verrebbe scelto comunque; la regola dice
  qual e' quello a larghezza fissa anche se un giorno se ne aggiungono altri (senza le
  regole di Alpine in conf.d fontconfig non lo sa).
-->
<fontconfig>
  <dir prefix="relative">../../usr/share/fonts</dir>
  <cachedir prefix="xdg">fontconfig</cachedir>
  <alias>
    <family>monospace</family>
    <prefer><family>DejaVu Sans Mono</family></prefer>
  </alias>
</fontconfig>
