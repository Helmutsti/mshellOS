# Il manifesto di Files (la guida voce per voce: manifest-guida.toml; le regole: APPLICAZIONI.md).
# Lo leggono il launcher, la scrivania e, dentro il pacchetto files.app, chi lo installa.

id = "files"
nome = "Files"
versione = "1.0.0"
autore = "mshell"
descrizione = "Sfoglia, rinomina e organizza i tuoi file e le tue cartelle."

# "@PROCESSORE@" lo sostituisce build.sh con il processore per cui compila (x86_64 o arm64):
# lo stesso sorgente diventa un pacchetto per ogni processore.
processore = "@PROCESSORE@"
sistema_minimo = 1

programma = "code"

permessi = ["file.scrivere"]
deviazioni = []
funzioni = ["file.apri_cartella", "file.mostra"]

# Le icone dell'app, dal disegno in Figma (pagina "App - Files", "Icona dell'app"): l'SVG
# 96 x 96 e le PNG semplificate da 32 e 18, una serie per tema.
[icone.chiaro]
svg = "resources/icona-chiara.svg"
png = { 18 = "resources/icona-chiara-18.png", 32 = "resources/icona-chiara-32.png", 48 = "resources/icona-chiara-48.png" }

[icone.scuro]
svg = "resources/icona-scura.svg"
png = { 18 = "resources/icona-scura-18.png", 32 = "resources/icona-scura-32.png", 48 = "resources/icona-scura-48.png" }
