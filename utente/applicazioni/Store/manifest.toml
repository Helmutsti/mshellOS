# Il manifesto dello Store (la guida voce per voce: manifest-guida.toml; le regole: APPLICAZIONI.md).
# Lo leggono il launcher, la scrivania e, dentro il pacchetto store.app, chi lo installa.

id = "store"
nome = "Store"
versione = "1.0.0"
autore = "mshell"
descrizione = "Le app installate, e l'installazione dei pacchetti .app."

# "@PROCESSORE@" lo sostituisce build.sh con il processore per cui compila (x86_64 o arm64):
# lo stesso sorgente diventa un pacchetto per ogni processore.
processore = "@PROCESSORE@"
sistema_minimo = 1

programma = "code"

# app.gestire: installare, aggiornare e togliere app (un permesso di sistema: lo Store e'
# un'app del sistema, in /system/apps/store). Il launcher lo controlla a ogni richiesta.
permessi = ["app.gestire"]
deviazioni = []
funzioni = []

# L'icona dal disegno Figma: il simbolo "package" di Lucide su rosa, con la luce dall'alto (rosa uguale nei due temi).
# Le PNG sono le versioni semplificate a 32 e 18.
[icone.chiaro]
svg = "resources/icona-chiara.svg"
png = { 18 = "resources/icona-chiara-18.png", 32 = "resources/icona-chiara-32.png" }

[icone.scuro]
svg = "resources/icona-scura.svg"
png = { 18 = "resources/icona-scura-18.png", 32 = "resources/icona-scura-32.png" }
