# Il manifesto di Impostazioni (la guida voce per voce: manifest-guida.toml; le regole: APPLICAZIONI.md).
# Lo leggono il launcher, la scrivania e, dentro il pacchetto impostazioni.app, chi lo installa.

id = "impostazioni"
nome = "Impostazioni"
versione = "1.0.0"
autore = "mshell"
descrizione = "Le impostazioni del sistema."

# "@PROCESSORE@" lo sostituisce build.sh con il processore per cui compila (x86_64 o arm64):
# lo stesso sorgente diventa un pacchetto per ogni processore.
processore = "@PROCESSORE@"
sistema_minimo = 1

programma = "code"

permessi = ["impostazioni.sistema"]
deviazioni = []
funzioni = []

# L'icona, dal disegno in Figma: SVG a 96 pixel (il sistema lo ridimensiona) e le PNG a 32 e a 18,
# una per tema.
[icone.chiaro]
svg = "resources/icona-chiara.svg"
png = { 18 = "resources/icona-chiara-18.png", 32 = "resources/icona-chiara-32.png" }

[icone.scuro]
svg = "resources/icona-scura.svg"
png = { 18 = "resources/icona-scura-18.png", 32 = "resources/icona-scura-32.png" }
