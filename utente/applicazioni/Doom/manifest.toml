# Il manifesto di Doom (la guida voce per voce: manifest-guida.toml; le regole: APPLICAZIONI.md).
# Lo leggono il launcher, la scrivania e, dentro il pacchetto doom.app, chi lo installa.

id = "doom"
nome = "Doom"
versione = "1.0.0"
autore = "mshell"
descrizione = "Il gioco del 1993, nella versione shareware."

# "@PROCESSORE@" lo sostituisce build.sh con il processore per cui compila (x86_64 o arm64):
# lo stesso sorgente diventa un pacchetto per ogni processore.
processore = "@PROCESSORE@"
sistema_minimo = 1

programma = "code"

permessi = []
deviazioni = []
funzioni = []

# L'icona: la faccia del giocatore dal gioco (24x29 pixel), come quadratini nell'SVG; uguale
# nei due temi. Le PNG piccole sono la stessa faccia, a 32 pixel per pixel e a 18 rimpicciolita.
[icone.chiaro]
svg = "resources/icona-chiara.svg"
png = { 18 = "resources/icona-chiara-18.png", 32 = "resources/icona-chiara-32.png", 48 = "resources/icona-chiara-48.png" }

[icone.scuro]
svg = "resources/icona-scura.svg"
png = { 18 = "resources/icona-scura-18.png", 32 = "resources/icona-scura-32.png", 48 = "resources/icona-scura-48.png" }
