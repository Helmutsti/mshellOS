# Il firewall del sistema: lo mette il servizio network all'avvio, prima di accendere la
# rete (utente/programmi/network.c, IL FIREWALL). Una cosa per riga, "chiave=valore"; le
# righe che cominciano con # non contano. Ogni chiave vale allow (lascia passare) o block
# (scarta). Come Mac e Windows a casa: da fuori non entra niente che non abbiamo chiesto.
#
#   incoming   le connessioni che arrivano da fuori (le risposte a quelle aperte da noi
#              passano sempre)
#   outgoing   le connessioni che apriamo noi
#   forward    i pacchetti che passerebbero da questo computer verso altri (fare da router)
#   ping       rispondere al ping (conta solo con incoming=block)
#
# Se questo file manca, o manca una chiave, il servizio usa la scelta piu' sicura:
# incoming=block, outgoing=allow, forward=block, ping=block.
incoming=block
outgoing=allow
forward=block
ping=allow
