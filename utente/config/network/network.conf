# La rete del sistema: la legge il servizio network all'avvio (utente/programmi/network.c).
# Una cosa per riga, "chiave=valore"; le righe che cominciano con # non contano.
#
#   interface=eth0          la scheda di rete da accendere
#   mode=dhcp               l'indirizzo lo chiede alla rete (DHCP)
#   mode=static             l'indirizzo e' scritto qui, con:
#     address=192.168.1.10/24   l'indirizzo e quanti bit sono della rete
#     gateway=192.168.1.1       la strada verso il resto di Internet
#     dns=192.168.1.1           chi traduce i nomi in indirizzi (anche piu' righe, fino a 3)
interface=eth0
mode=dhcp
