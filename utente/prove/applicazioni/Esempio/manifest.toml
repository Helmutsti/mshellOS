# Il manifesto di Esempio (la guida voce per voce: manifest-guida.toml; le regole: APPLICAZIONI.md).
# Lo leggono il launcher, la scrivania e, dentro il pacchetto esempio.app, chi lo installa.

id = "esempio"
nome = "Esempio"
versione = "1.0.0"
autore = "mshell"
descrizione = "Un'app d'esempio che disegna da sola la sua finestra."

# "@PROCESSORE@" lo sostituisce build.sh con il processore per cui compila (x86_64 o arm64):
# lo stesso sorgente diventa un pacchetto per ogni processore.
processore = "@PROCESSORE@"
sistema_minimo = 1

programma = "code"

permessi = []
deviazioni = []
funzioni = []

# L'icona, dal disegno in Figma: SVG a 96 pixel (il sistema lo ridimensiona) e le PNG a 32 e a 18,
# una per tema.
[icone.chiaro]
svg = "resources/icona-chiara.svg"
png = { 18 = "resources/icona-chiara-18.png", 32 = "resources/icona-chiara-32.png", 48 = "resources/icona-chiara-48.png" }

[icone.scuro]
svg = "resources/icona-scura.svg"
png = { 18 = "resources/icona-scura-18.png", 32 = "resources/icona-scura-32.png", 48 = "resources/icona-scura-48.png" }
