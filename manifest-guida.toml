# =============================================================================
#  mshell - guida al manifesto di un'applicazione
# =============================================================================
#
#  Questo file è una GUIDA da leggere, non il manifesto di un'app vera.
#  Mostra tutte le voci che un manifesto può avere, ognuna con la sua spiegazione.
#  Le regole complete sono in APPLICAZIONI.md.
#
#  Il manifesto si chiama "manifest.toml" e sta dentro il pacchetto .app.
#  È scritto in TOML: righe "chiave = valore", sezioni tra parentesi quadre,
#  elenchi tra [ ], testi tra virgolette. Le righe che cominciano con # sono commenti.
#  Attenzione: tutto quello che sta sotto una sezione [nome] appartiene a quella
#  sezione, quindi le voci semplici vanno prima e le sezioni (come [icone]) in fondo.
#
#  Le voci segnate "DA DECIDERE" esistono già come idea, ma i valori possibili
#  non sono ancora stabiliti: quelli scritti qui sono solo esempi.
#
#  Nessuna di queste regole è ancora costruita nel sistema.
# =============================================================================


# --- Chi è l'app -------------------------------------------------------------

# Identificativo fisso dell'app. Lo sceglie chi la sviluppa e NON deve mai
# cambiare: da lui dipendono gli aggiornamenti, la cartella dei dati di ogni
# persona e i permessi. Per ora è un nome semplice (minuscole, cifre, trattini).
# La forma definitiva (per esempio "it.mep.note") è DA DECIDERE.
id = "note"

# Il nome che la persona vede sotto l'icona. Può cambiare tra una versione e l'altra.
nome = "Note"

# Versione dell'app. Serve a capire se un pacchetto è un aggiornamento.
versione = "1.0.0"

# Chi ha fatto l'app (solo da mostrare). La firma vera arriverà più avanti.
autore = "Mario Rossi"

# Una frase che spiega a cosa serve, mostrata durante l'installazione.
descrizione = "Prendi appunti veloci e ritrovali quando ti servono."


# --- Per quale sistema è fatta -----------------------------------------------

# Il processore per cui è compilato il programma: "x86_64" (PC) oppure "arm64".
# Ogni pacchetto è fatto per un solo processore. Se non corrisponde a quello del
# computer, l'installazione si ferma con un avviso che spiega il problema.
processore = "x86_64"

# La versione minima del sistema di cui l'app ha bisogno.
# Si scrive solo il minimo: è il sistema a dichiarare quali versioni non supporta più.
sistema_minimo = 1


# --- Cosa avviare ------------------------------------------------------------

# Il programma da avviare, relativo alla cartella dell'app installata.
programma = "code"

# Se l'app di sistema sta anche nella userbar (la barra a sinistra). Se manca vale
# true. Con false l'app compare solo nel vassoio delle app. Le app installate
# dalla persona non sono fissate nella userbar in ogni caso.
nella_barra = true


# --- Permessi: cosa l'app CHIEDE al sistema ----------------------------------
#
# L'elenco dei servizi del sistema che l'app vuole usare. Al primo avvio il
# sistema li chiede tutti insieme alla persona; dopo, si possono spegnere dalle
# Impostazioni.
#
# Per ogni permesso concesso, il sistema apre un canale tra l'app e quel
# servizio. Senza canale l'app non può nemmeno chiedere. Il toolkit nasconde
# tutto questo: chi sviluppa chiama le funzioni normali, e se un permesso manca
# riceve un errore chiaro.
#
# REGOLA: l'app deve funzionare (o spiegare cosa non va) anche se la persona
# dice no a uno o più permessi.
#
# Senza permessi l'app ha già la base: le sue finestre, la sua cartella dei
# dati, tema/lingua/ora in lettura, e i file che la persona sceglie dalla
# finestra "Apri"/"Salva" del sistema. Spesso non serve chiedere altro.
#
# Permessi normali (li concede la persona):
#   "files.read"   leggere tutti i file della persona
#   "files.write"  leggere e modificare tutti i file della persona
#   "notifications"      mandare notifiche
#   "network.use"       usare la rete e internet
#   "audio"          riprodurre suoni
# Permessi di sistema (oggi solo per le app del sistema):
#   "processes.view", "processes.stop", "settings.system", "system.power", "apps.manage",
#   "network.settings", "network.firewall.rules", "network.firewall" (PERMESSI.txt)
#
# L'elenco completo e le regole sono in APPLICAZIONI.md (sezione 9).

permessi = ["files.read", "notifications"]


# --- Deviazioni dallo standard -----------------------------------------------
#
# Lo standard è: l'app ha una finestra, lavora mentre la finestra è aperta e si
# ferma quando la chiudi. Tutto quello che si allontana da questo va dichiarato
# qui. Non c'è niente di male, ma la persona ne viene informata.
#
# Se un'app si comporta in modo diverso senza averlo dichiarato (per esempio
# non apre nessuna finestra) il sistema se ne accorge e la ferma o avvisa.
#
# Deviazioni possibili (si scrivono solo quelle che servono):
#   "senza_finestra"    l'app non mostra nessuna interfaccia grafica
#   "sottofondo"        l'app resta accesa anche quando la finestra è chiusa
#   "avvio_automatico"  l'app parte da sola quando la persona entra
#   "schermo_intero"    l'app può coprire tutto lo schermo, barra compresa
#
# Un'app normale come questa non ha deviazioni: l'elenco è vuoto.

deviazioni = []


# --- Funzioni: cosa l'app OFFRE (per i ruoli) --------------------------------
#
# Un ruolo (per esempio "mail" o "firewall") è un insieme di funzioni, con un
# minimo obbligatorio. Se l'app offre tutte le funzioni obbligatorie di un
# ruolo, la persona la può scegliere per quel ruolo; se ne mancano, non viene
# proposta.
#
# Le app non si parlano mai direttamente: quando un'app chiede "scrivi una
# nota", è il sistema che consegna la richiesta all'app del ruolo giusto.
#
# Ruoli e funzioni obbligatorie (APPLICAZIONI.md, sezione 9):
#   file       "file.apri_cartella", "file.mostra"
#   browser    "web.apri"
#   mail       "mail.scrivi"
#   immagini   "immagine.apri"
#   testo      "testo.apri", "testo.nuovo"
#   terminale  "terminale.apri"
#
# Questa app di note sa aprire e creare testi, quindi copre il ruolo "testo".

funzioni = ["testo.apri", "testo.nuovo"]


# --- Icone -------------------------------------------------------------------
#
# Un disegno SVG per ogni tema (chiaro e scuro), che va bene a qualsiasi misura.
# In più, delle PNG facoltative per le misure piccole, dove un disegno
# vettoriale rimpicciolito viene male. I percorsi sono relativi al pacchetto.
#
# Se manca qualcosa, l'app si installa lo stesso: il sistema usa la cosa più
# adatta che trova (la misura più vicina, l'altro tema) e un avviso spiega cosa
# manca e cosa significa (per esempio "in tema scuro vedrai l'icona chiara").

[icone.chiaro]
svg = "resources/icona-chiara.svg"
png = { 18 = "resources/icona-chiara-18.png", 32 = "resources/icona-chiara-32.png" }

[icone.scuro]
svg = "resources/icona-scura.svg"
png = { 18 = "resources/icona-scura-18.png" }   # manca la 32: si rimpicciolisce l'SVG


# --- Tipi di file che l'app sa aprire ----------------------------------------
#
# DA DECIDERE: come si dichiarano i tipi di file (per estensione, per tipo).
# Esempio di come potrebbe essere:
#
# [file]
# apre = ["txt", "md"]
