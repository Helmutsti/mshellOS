# LA MACCHINA: il portatile Acer Swift della persona (Intel Core i3 di 7a generazione, grafica
# Intel HD/UHD 620, schermo 1920x1080), avviato da una chiavetta USB (la prova "live", 27/11/2026).
# costruisci.sh la legge (sh costruisci.sh acer-swift); il disco esce in build/disco-acer-swift.img
# e si scrive cosi' com'e' sulla chiavetta.
# Niente firmware: la grafica Intel di quella generazione va senza, e per ora niente rete
# (la persona, 27/11/2026). Il driver della grafica (i915), di tastiera, mouse e touchpad sono gia'
# nel kernel di Debian e li carica il sistema dei dispositivi (udev) dopo l'avvio.

# I driver che servono per arrivare al disco del sistema, cioe' alla chiavetta: il controllore USB
# (xhci, ed ehci per le porte vecchie), la chiavetta (usb_storage e uas, il modo veloce), il disco
# visto dal sistema (sd_mod) e il formato ext4
DRIVER_AVVIO="xhci_pci xhci_hcd ehci_pci usb_storage uas sd_mod ext4"

# Parole in piu' per il kernel: nessuna (la chiavetta si aspetta da sola: l'archivio d'avvio
# attende la partizione "system" finche' non compare)
RIGA_KERNEL=""

# La misura dello schermo: lo sfondo si prepara gia' a questa misura durante la costruzione
SCHERMO_LARGHEZZA=1920
SCHERMO_ALTEZZA=1080

# I firmware del Wi-Fi (la persona, 27/11/2026: Intel e Atheros, le due schede possibili su
# questo portatile). Stanno nella parte "non-free-firmware" di Debian.
FIRMWARE="firmware-iwlwifi firmware-atheros"

# Le app gia' dentro (sul portatile non c'e' internet): l'editor di testo e la calcolatrice di
# GNOME, con la loro base comune; Firefox e il terminale Ptyxis (la persona, 27/11/2026)
APP_FLATPAK="org.gnome.TextEditor org.gnome.Calculator org.mozilla.firefox app.devsuite.Ptyxis"

# Il processore: il kernel di Debian per PC, il nome del file d'avvio che il firmware UEFI cerca
# sui PC, la porta seriale dei PC (sul portatile non c'e': l'accesso sulla seriale resta spento)
KERNEL=linux-image-amd64
FILE_AVVIO=BOOTX64.EFI
SERIALE=ttyS0
