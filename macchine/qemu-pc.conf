# LA MACCHINA: QEMU sul PC Windows (x86_64), con disco e scheda video virtio.
# Un file per ogni macchina su cui si prova il sistema (decisione della persona): dice cosa
# serve a QUELLA macchina, cosi' la costruzione mette solo quello. costruisci.sh lo legge
# (sh costruisci.sh qemu-pc); il disco esce in build/disco-qemu-pc.img.

# I driver che servono per arrivare al disco del sistema: vanno nell'archivio d'avvio, e
# solo loro (il disco virtio, il bus PCI virtio, il formato ext4)
DRIVER_AVVIO="virtio_pci virtio_blk ext4"

# Parole in piu' per il kernel (la sua riga di comando, nel file tutto-in-uno): il driver del
# disco si carica subito, senza aspettare il sistema dei dispositivi (udev)
RIGA_KERNEL="rd.driver.pre=virtio_pci,virtio_blk"
