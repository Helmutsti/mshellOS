# LA MACCHINA: QEMU sul Mac (arm64, Apple Silicon), con disco e scheda video virtio.
# Il gemello di qemu-pc.conf: stesso sistema, cambia solo quello che dipende dal processore.
# costruisci.sh lo legge (sh costruisci.sh qemu-mac); il disco esce in build/disco-qemu-mac.img;
# lo accende avvia-mac.sh.

# I driver che servono per arrivare al disco del sistema (come sul PC)
DRIVER_AVVIO="virtio_pci virtio_blk ext4"
RIGA_KERNEL="rd.driver.pre=virtio_pci,virtio_blk"

# La misura dello schermo (avvia-mac.sh, xres e yres della scheda video virtio-gpu)
SCHERMO_LARGHEZZA=1280
SCHERMO_ALTEZZA=800

# Il processore: il kernel di Debian per ARM, il nome del file d'avvio che il firmware UEFI
# cerca sulle macchine ARM, la porta seriale delle macchine ARM di QEMU (PL011)
KERNEL=linux-image-arm64
FILE_AVVIO=BOOTAA64.EFI
SERIALE=ttyAMA0
